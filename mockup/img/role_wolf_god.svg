<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <!-- Outer Trading Card Border (Pokemon card 63:88 / 5:7 aspect ratio) -->
  <rect x="6" y="6" width="388" height="548" rx="22" fill="url(#cardBg)" stroke="url(#frameGrad)" stroke-width="8"/>
  <rect x="18" y="18" width="364" height="524" rx="14" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Card Header (Role Name & Faction Badge) -->
  <text x="34" y="54" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="900">人狼神</text>
  <rect x="256" y="28" width="110" height="32" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="311" y="49" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="800">人狼陣営</text>

  <!-- Illustration Window -->
  <rect x="32" y="72" width="336" height="250" rx="10" fill="#090d16" fill-opacity="0.7" stroke="#f43f5e" stroke-width="3"/>
  <circle cx="200" cy="185" r="68" fill="#4c0519" fill-opacity="0.6" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="200" y="208" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-size="68">👁️</text>
  <text x="200" y="304" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">[イラスト領域: img/role_wolf_god.svg]</text>

  <!-- Skill / Ability Box -->
  <rect x="32" y="340" width="336" height="156" rx="10" fill="#0f172a" fill-opacity="0.82" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="48" y="370" fill="#f43f5e" font-family="sans-serif" font-size="15" font-weight="800">◆ 役職スキル・特性</text>
  <line x1="48" y1="380" x2="352" y2="380" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="48" y="410" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="700">全てのプレイヤーの役職が最初からわかる。</text>
  <text x="48" y="438" fill="#cbd5e1" font-family="sans-serif" font-size="14">夜に人狼と協力して市民を襲撃する。</text>

  <!-- Card Footer -->
  <text x="200" y="525" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">POKE-CARD SIZE (400x560 / 63:88) - img/role_wolf_god.svg</text>
</svg>