<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <!-- Outer Trading Card Border (Pokemon card 63:88 / 5:7 aspect ratio) -->
  <rect x="6" y="6" width="388" height="548" rx="22" fill="url(#cardBg)" stroke="url(#frameGrad)" stroke-width="8"/>
  <rect x="18" y="18" width="364" height="524" rx="14" fill="none" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Card Header (Role Name & Faction Badge) -->
  <text x="34" y="54" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="900">サイコキラー</text>
  <rect x="256" y="28" width="110" height="32" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#e879f9" stroke-width="1.5"/>
  <text x="311" y="49" text-anchor="middle" fill="#e879f9" font-family="sans-serif" font-size="13" font-weight="800">人狼陣営</text>

  <!-- Illustration Window -->
  <rect x="32" y="72" width="336" height="250" rx="10" fill="#090d16" fill-opacity="0.7" stroke="#e879f9" stroke-width="3"/>
  <circle cx="200" cy="185" r="68" fill="#3b0764" fill-opacity="0.6" stroke="#e879f9" stroke-width="2.5"/>
  <text x="200" y="208" text-anchor="middle" fill="#e879f9" font-family="sans-serif" font-size="68">🔪</text>
  <text x="200" y="304" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">[イラスト領域: img/role_psycho.svg]</text>

  <!-- Skill / Ability Box -->
  <rect x="32" y="340" width="336" height="156" rx="10" fill="#0f172a" fill-opacity="0.82" stroke="#e879f9" stroke-width="1.5"/>
  <text x="48" y="370" fill="#e879f9" font-family="sans-serif" font-size="15" font-weight="800">◆ 役職スキル・特性</text>
  <line x1="48" y1="380" x2="352" y2="380" stroke="#e879f9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="48" y="410" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="700">夜に関わったプレイヤーは全員殺される。</text>
  <text x="48" y="438" fill="#cbd5e1" font-family="sans-serif" font-size="14">人狼側・市民側問わず返り討ちにする。</text>

  <!-- Card Footer -->
  <text x="200" y="525" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">POKE-CARD SIZE (400x560 / 63:88) - img/role_psycho.svg</text>
</svg>