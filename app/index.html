<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <title>オリジナル人狼ゲーム - TASK &amp; MYSTERY WEREWOLF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 演出テスト用操作バー（ワンタップで全演出を再生確認可能） -->
  <header class="dev-preview-bar">
    <div class="dev-preview-bar__header">
      <span>🎬 演出テスト用プレビューバー</span>
      <span style="color:#64748b">いつでもテスト再生可能</span>
    </div>
    <div class="dev-preview-bar__buttons">
      <button type="button" class="dev-btn" id="btnTestMorningKill">🌅 朝（追放＋夜襲爪切り裂き）</button>
      <button type="button" class="dev-btn" id="btnTestMorningShield">🛡️ 朝（追放＋ナイト盾防御）</button>
      <button type="button" class="dev-btn" id="btnTestDay">🗣️ 昼（村人広場に集合）</button>
      <button type="button" class="dev-btn" id="btnTestNight">🐺 夜（日没＋オオカミ遠吠え）</button>
    </div>
  </header>

  <main class="stage">
    <div class="phone" id="phone" aria-live="polite"></div>
  </main>

  <!-- 占い師・霊媒師の即時結果 / お知らせモーダル（ネイティブ dialog） -->
  <dialog class="result" id="resultDialog" aria-labelledby="resTitle">
    <div class="result__ico" id="resIco">🔮</div>
    <h2 class="result__title" id="resTitle"></h2>
    <div class="result__body" id="resBody"></div>
    <p class="result__note" id="resNote"></p>
    <form method="dialog"><button type="submit" class="btn btn--solid btn--violet" autofocus>閉じる（OK）</button></form>
  </dialog>

  <!-- ルーム退室・解散の確認警告モーダル -->
  <dialog class="result result--warn" id="leaveDialog" aria-labelledby="leaveTitle">
    <div class="result__ico">⚠️</div>
    <h2 class="result__title" id="leaveTitle">本当にルームを抜けますか？</h2>
    <div class="result__body" id="leaveBody" style="font-size:14px;font-weight:700"></div>
    <p class="result__note" id="leaveNote"></p>
    <div class="leave-dialog__actions">
      <button type="button" class="btn btn--ghost" id="btnLeaveCancel">キャンセル（戻る）</button>
      <button type="button" class="btn btn--solid btn--red" id="btnLeaveConfirm">はい、ルームを抜ける</button>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
