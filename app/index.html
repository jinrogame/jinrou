<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <title>オリジナル人狼ゲーム - TASK &amp; MYSTERY WEREWOLF</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <main class="stage">
    <div class="phone" id="phone" aria-live="polite"></div>
  </main>

  <!-- 占い師・霊媒師の即時結果 / お知らせモーダル（ネイティブ dialog） -->
  <dialog class="result" id="resultDialog" aria-labelledby="resTitle">
    <div class="result__ico" id="resIco">🔮</div>
    <h2 class="result__title" id="resTitle"></h2>
    <div class="result__body" id="resBody"></div>
    <p class="result__note" id="resNote"></p>
    <form method="dialog"><button type="submit" class="btn btn--solid btn--violet" autofocus>閉じる（OK）</button></form>
  </dialog>

  <!-- ルーム退室・解散の確認警告モーダル -->
  <dialog class="result result--warn" id="leaveDialog" aria-labelledby="leaveTitle">
    <div class="result__ico">⚠️</div>
    <h2 class="result__title" id="leaveTitle">本当にルームを抜けますか？</h2>
    <div class="result__body" id="leaveBody" style="font-size:14px;font-weight:700"></div>
    <p class="result__note" id="leaveNote"></p>
    <div class="leave-dialog__actions">
      <button type="button" class="btn btn--ghost" id="btnLeaveCancel">キャンセル（戻る）</button>
      <button type="button" class="btn btn--solid btn--red" id="btnLeaveConfirm">はい、ルームを抜ける</button>
    </div>
  </dialog>

  <!-- ルール・役職設定モーダル（ポップアップ） -->
  <dialog class="result result--config" id="ruleConfigDialog" aria-labelledby="ruleConfigTitle">
    <div class="result__ico">⚙️</div>
    <h2 class="result__title" id="ruleConfigTitle">ゲームルール・役職設定</h2>
    <div class="config-modal-scroll" id="ruleConfigContent"></div>
    <div style="margin-top:10px">
      <button type="button" class="btn btn--solid btn--cyan" id="btnCloseRuleConfig">設定を完了して戻る</button>
    </div>
  </dialog>

  <!-- 役職配分＆役職説明モーダル（入室後いつでも確認可能） -->
  <dialog class="result result--config" id="roleListDialog" aria-labelledby="roleListTitle">
    <div class="result__ico">📜</div>
    <h2 class="result__title" id="roleListTitle">設定されている役職一覧</h2>
    <div class="config-modal-scroll" id="roleListContent"></div>
    <div style="margin-top:10px">
      <button type="button" class="btn btn--solid btn--cyan" id="btnCloseRoleList">閉じる</button>
    </div>
  </dialog>

  <!-- 📖 遊び方・ゲームマニュアルモーダル（タブ形式で快適閲覧） -->
  <dialog class="result result--config manual-dialog" id="manualDialog" aria-labelledby="manualTitle">
    <div class="result__ico">📖</div>
    <h2 class="result__title" id="manualTitle">遊び方・ゲームマニュアル</h2>
    <div style="margin: 8px 0; display: flex; gap: 8px;">
      <a href="slides.html" target="_blank" rel="noopener" class="btn btn--solid btn--amber" style="flex:1;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;padding:9px 12px;box-shadow:0 0 12px rgba(251,191,36,0.3)">
        <span>🖥️</span> <b>ルール解説スライドを開く（動画あり）</b> <span>↗</span>
      </a>
    </div>
    <div class="manual-tabs" role="tablist">
      <button type="button" class="manual-tab-btn is-active" data-man-tab="manRules">📜 基本ルール</button>
      <button type="button" class="manual-tab-btn" data-man-tab="manRoles">🃏 役職一覧</button>
      <button type="button" class="manual-tab-btn" data-man-tab="manMinigames">🎯 タスク＆効果</button>
    </div>
    <div class="config-modal-scroll manual-modal-scroll" id="manualContent"></div>
    <div style="margin-top:10px">
      <button type="button" class="btn btn--solid btn--cyan" id="btnCloseManual">マニュアルを閉じる</button>
    </div>
  </dialog>

  <!-- 自分の役職確認ダイアログ（誤タップ防止確認付き） -->
  <dialog class="result result--config" id="myRoleDialog" aria-labelledby="myRoleTitle">
    <div id="myRoleConfirmStep">
      <div class="result__ico">⚠️</div>
      <h2 class="result__title" id="myRoleTitle">役職を確認しますか？</h2>
      <p class="muted center" style="margin:12px 0 18px;font-size:13px;line-height:1.6">
        周囲のプレイヤーに画面が見られないようご注意ください。<br>本当にあなたの役職を表示しますか？
      </p>
      <div style="display:flex;gap:10px">
        <button type="button" class="btn btn--ghost" id="btnCancelMyRole">キャンセル</button>
        <button type="button" class="btn btn--solid btn--amber" id="btnShowMyRole">表示する</button>
      </div>
    </div>
    <div id="myRoleCardStep" hidden>
      <div class="result__ico" id="myRoleCardIco">🃏</div>
      <h2 class="result__title" id="myRoleCardTitle">あなたの役職</h2>
      <div class="config-modal-scroll" id="myRoleCardContent" style="text-align:center"></div>
      <div style="margin-top:10px">
        <button type="button" class="btn btn--solid btn--cyan" id="btnCloseMyRole">閉じて隠す</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/main.js?v=8"></script>
</body>
</html>
